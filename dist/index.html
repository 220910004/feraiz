ı alır.",dalil:"Nisa Suresi 11 ve asabe hükümleri birlikte",example:"Vefat eden: Baba, kız. Kız 1/2, baba 1/6 + kalan (2/6) = 3/6 alır."},{id:7,category:"parents",categoryAr:"أحوال الأبوين",title:"Babanın Sadece 1/6 Alması",titleAr:"إرث الأب السدس فقط",heirs:"Baba + Oğul (veya oğlun oğlu)",shares:"Baba: 1/6",explanation:"Oğul veya oğlun oğlu varsa, baba sadece 1/6 farz payını alır.",dalil:"وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِّنْهُمَا السُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُ وَلَدٌ (Nisa, 11)",example:"Vefat eden: Baba, anne, oğul. Baba 1/6, anne 1/6, oğul kalanı alır."},{id:8,category:"parents",categoryAr:"أحوال الأبوين",title:"Annenin 1/6 Alması (Çocuk Varken)",titleAr:"إرث الأم السدس مع الولد",heirs:"Anne + Çocuk",shares:"Anne: 1/6",explanation:"Ölenin çocuğu veya çocuğunun çocuğu varsa, anne 1/6 alır.",dalil:"وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِّنْهُمَا السُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُ وَلَدٌ (Nisa, 11)",example:"Vefat eden: Anne, baba, oğul. Anne 1/6, baba 1/6, oğul kalan."},{id:9,category:"parents",categoryAr:"أحوال الأبوين",title:"Annenin 1/6 Alması (Çoğul Kardeş Varken)",titleAr:"إرث الأم السدس مع الإخوة",heirs:"Anne + 2 veya daha fazla kardeş",shares:"Anne: 1/6",explanation:"İki veya daha fazla kardeş varsa (erkek veya kız), anne 1/3 yerine 1/6 alır. Bu kardeşler bizzat miras alamasalar bile anneyi hacb ederler (payını azaltırlar).",dalil:"فَإِن كَانَ لَهُ إِخْوَةٌ فَلِأُمِّهِ السُّدُسُ (Nisa, 11)",example:"Vefat eden: Anne, baba, 2 erkek kardeş. Anne 1/6, baba asabe. Kardeşler baba varken miras alamaz ama anneyi hacb eder."},{id:10,category:"parents",categoryAr:"أحوال الأبوين",title:"Annenin 1/3 Alması",titleAr:"إرث الأم الثلث",heirs:"Anne + çocuksuz + tek kardeş veya kardeşsiz",shares:"Anne: 1/3",explanation:"Çocuk ve çocuğun çocuğu yoksa, iki veya daha fazla kardeş yoksa, anne 1/3 alır.",dalil:"فَإِن لَّمْ يَكُن لَّهُ وَلَدٌ وَوَرِثَهُ أَبَوَاهُ فَلِأُمِّهِ الثُّلُثُ (Nisa, 11)",example:"Vefat eden: Anne, baba. Anne 1/3, baba kalan 2/3'ü alır."},{id:11,cate ğlu onun yerine geçer ve asabe olarak miras alır. Ne kadar aşağı inerse insin aynı kural geçerlidir.",dalil:"Asabe hükümleri - İcma",example:"Vefat eden: Oğlun oğlu, kız. Kız 1/2, oğlun oğlu kalan 1/2'yi alır."},{id:16,category:"children",categoryAr:"أحوال الأولاد",title:"Oğlun Kızının Miras Alması",titleAr:"إرث بنت الابن",heirs:"Oğlun kızı",shares:"Tek: 1/2, İki+: 2/3, Kızla: 1/6 (tamamlama)",explanation:"Oğlun kızı, öz kız yoksa onun hükmündedir. Tek öz kız varsa 1/6 tamamlama payı alır (2/3'e tamamlar).",dalil:"Hz. Peygamber'in hükmü (Buhari)",example:"Vefat eden: 1 kız, 1 oğlun kızı. Kız 1/2, oğlun kızı 1/6 (2/3'e tamamlama)."},{id:17,category:"grandparents",categoryAr:"أحوال الأجداد",title:"Dedenin 1/6 Alması",titleAr:"إرث الجد السدس",heirs:"Dede + Oğul (baba yok)",shares:"Dede: 1/6",explanation:"Baba yokken dede, baba gibi miras alır. Oğul veya oğlun oğlu varsa 1/6 alır.",dalil:"Baba hükmünde - İcma",example:"Vefat eden: Dede, oğul. Dede 1/6, oğul kalan 5/6'yı alır."},{id:18,category:"grandparents",categoryAr:"أحوال الأجداد",title:"Dedenin 1/6 + Asabe Alması",titleAr:"إرث الجد السدس والتعصيب",heirs:"Dede + Sadece kız (baba yok)",shares:"Dede: 1/6 + Asabe",explanation:"Baba yokken, sadece kız çocuk varsa, dede hem 1/6 hem de kalan asabeyi alır.",dalil:"Baba hükmünde - İcma",example:"Vefat eden: Dede, kız. Kız 1/2, dede 1/6 + kalan 2/6 = 3/6."},{id:19,category:"grandparents",categoryAr:"أحوال الأجداد",title:"Dedenin Asabe Olarak Miras Alması",titleAr:"إرث الجد بالتعصيب فقط",heirs:"Dede + çocuksuz (baba yok)",shares:"Dede: Asabe (kalan veya tamamı)",explanation:"Çocuk ve baba yoksa, dede asabe olarak kalandan veya tamamından miras alır.",dalil:"Asabe hükümleri",example:"Vefat eden: Dede, karı. Karı 1/4, dede kalan 3/4'ü alır."},{id:20,category:"grandparents",categoryAr:"أحوال الأجداد",title:"Ninenin 1/6 Alması",titleAr:"إرث الجدة السدس",heirs:"Nine (anne yok)",shares:"Nine: 1/6",explanation:"Anne yokken, nine (hem anne tarafı hem baba tarafı) 1/6 alır. Birden fazla nine varsa 1/6'yı paylaşırlar.",dalil:"Hz. Peygamber nineye 1/6 verdi (Ebu Davud, Tirmizi)",example:"Vefat eden: Babaanne, anneanne, oğul. İki nine 1/6'yı eşit paylaşır (her biri 1/12)."},{id:21,category:"grandparents",categoryAr:"أحوال الأجداد",title:"Ninenin Anne Tarafından Hacb Olması",titleAr:"حجب الجدة بالأم",heirs:"Nine + Anne",shares:"Nine: Hacb (pay yok)",explanation:"Anne hayattaysa, tüm nineler (anne tarafı ve baba tarafı) hacb olur ve miras alamaz.",dalil:"Yakın akraba uzak akrabayı hacb eder - İcma",example:"Vefat eden: Anne, babaanne. Anne 1/3, babaanne miras alamaz."},{id:22,category:"grandparents",categoryAr:"أحوال الأجداد",title:"Dedenin Baba Tarafından Hacb Olması",titleAr:"حجب الجد بالأب",heirs:"Dede + Baba",shares:"Dede: Hacb (pay yok)",explanation:"Baba hayattaysa, dede hacb olur ve miras alamaz.",dalil:"Yakın akraba uzak akrabayı hacb eder - İcma",example:"Vefat eden: Baba, dede, oğul. Baba 1/6, oğul kalan. Dede hacb."},{id:23,category:"siblings",categoryAr:"أحوال الإخوة",title:"Öz Kız Kardeşin 1/2 Alması",titleAr:"إرث الأخت الشقيقة النصف",heirs:"Tek öz kız kardeş (çocuk ve baba yok)",shares:"Öz kız kardeş: 1/2",explanation:"Çocuk, oğlun çocuğu ve baba yoksa, tek öz kız kardeş 1/2 alır.",dalil:"إِنِ امْرُؤٌ هَلَكَ لَيْسَ لَهُ وَلَدٌ وَلَهُ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ (Nisa, 176)",example:"Vefat eden: Öz kız kardeş, anne. Öz kız kardeş 1/2, anne 1/3."},{id:24,category:"siblings",categoryAr:"أحوال الإخوة",title:"İki+ Öz Kız Kardeşin 2/3 Alması",titleAr:"إرث الأختين الشقيقتين الثلثين",heirs:"2+ öz kız kardeş (çocuk ve baba yok)",shares:"Öz kız kardeşler: 2/3 (eşit)",explanation:"İki veya daha fazla öz kız kardeş, 2/3'ü aralarında eşit bölüşürler.",dalil:"فَإِن كَانَتَا اثْنَتَيْنِ فَلَهُمَا الثُّلُثَانِ مِمَّا تَرَكَ (Nisa, 176)",example:"Vefat eden: 3 öz kız kardeş. Her biri 2/9 (2/3 ÷ 3) alır."},{id:25,category:"siblings",categoryAr:"أحوال الإخوة",title:"Öz Erkek Kardeşin Asabe Olması",titleAr:"إرث الأخ الشقيق بالتعصيب",heirs:"Öz erkek kardeş (çocuk ve baba yok)",shares:"Öz erkek kardeş: Asabe",explanation:"Öz erkek kardeş asabe bi-nefsihi'dir. Farz sahiplerinden sonra kalanı alır.",dalil:"وَهُوَ يَرِثُهَا إِن لَّمْ يَكُن لَّهَا وَلَدٌ (Nisa, 176)",example:"Vefat eden: Öz erkek kardeş, anne. Anne 1/3, öz erkek kardeş kalan 2/3."},{id:26,category:"siblings",categoryAr:"أحوال الإخوة",title:"Öz Kardeşlerin Birlikte Miras Alması",titleAr:"إرث الإخوة الأشقاء معاً",heirs:"Öz erkek + öz kız kardeş",shares:"Erkek: 2, Kız: 1 birim (asabe)",explanation:"Öz erkek ve kız kardeşler birlikte olunca, kız asabe bi-gayrihi olur. Erkek kadının iki katı alır.",dalil:"وَإِن كَانُوا إِخْوَةً رِّجَالًا وَنِسَاءً فَلِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ (Nisa, 176)",example:"Vefat eden: 1 öz erkek kardeş, 1 öz kız kardeş. Erkek 2/3, kız 1/3."},{id:27,category:"siblings",categoryAr:"أحوال الإخوة",title:"Baba Bir Kardeşlerin Durumu",titleAr:"إرث الإخوة لأب",heirs:"Baba bir kardeş (öz kardeş yok)",shares:"Öz kardeş gibi",explanation:"Öz kardeş yoksa, baba bir kardeşler öz kardeşlerin hükmündedir. Aynı pay kuralları geçerlidir.",dalil:"Kıyas - öz kardeş yokken baba bir kardeş onun yerine geçer",example:"Vefat eden: 1 baba bir kız kardeş. Öz kardeş yok. Baba bir kız 1/2 alır."},{id:28,category:"siblings",categoryAr:"أحوال الإخوة",title:"Baba Bir Kız Kardeşin 1/6 Alması",titleAr:"إرث الأخت لأب السدس",heirs:"Baba bir kız kardeş + tek öz kız kardeş",shares:"Baba bir kız: 1/6 (tamamlama)",explanation:"Tek öz kız kardeş 1/2 aldığında, baba bir kız kardeş 1/6 tamamlama payı alır (2/3'e tamamlar).",dalil:"Oğlun kızı kıyası - İcma",example:"Vefat eden: 1 öz kız kardeş, 1 baba bir kız kardeş. Öz kız 1/2, baba bir kız 1/6."},{id:29,category:"siblings",categoryAr:"أحوال الإخوة",title:"Anne Bir Kardeşin 1/6 Alması",titleAr:"إرث الأخ لأم السدس",heirs:"Tek anne bir kardeş",shares:"Anne bir kardeş: 1/6",explanation:"Anne bir kardeş (erkek veya kız fark etmez) tek olunca 1/6 alır. Çocuk veya baba/dede varsa hacb olur.",dalil:"وَلَهُ أَخٌ أَوْ أُخْتٌ فَلِكُلِّ وَاحِدٍ مِّنْهُمَا السُّدُسُ (Nisa, 12)",example:"Vefat eden: Anne bir erkek kardeş, eş. Anne bir kardeş 1/6."},{id:30,category:"siblings",categoryAr:"أحوال الإخوة",title:"İki+ Anne Bir Kardeşin 1/3 Alması",titleAr:"إرث الإخوة لأم الثلث",heirs:"2+ anne bir kardeş",shares:"Anne bir kardeşler: 1/3 (eşit)",explanation:"İki veya daha fazla anne bir kardeş, 1/3'ü aralarında eşit bölüşürler. Erkek-kız fark etmez, hepsi eşit alır.",dalil:"فَإِن كَانُوا أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَاءُ فِي الثُّلُثِ (Nisa, 12)",example:"Vefat eden: 1 anne bir erkek, 2 anne bir kız kardeş. 3 kişi 1/3'ü eşit bölüşür (her biri 1/9)."},{id:31,category:"siblings",categoryAr:"أحوال الإخوة",title:"Kardeşlerin Oğul/Baba ile Hacb Olması",titleAr:"حجب الإخوة بالابن والأب",heirs:"Kardeşler + Oğul veya Baba",shares:"Kardeşler: Hacb (pay yok)",explanation:"Oğul, oğlun oğlu veya baba varsa, tüm kardeşler (öz, baba bir, anne bir) hacb olur.",dalil:"Yakın asabe uzak asabeyi hacb eder",example:"Vefat eden: Öz erkek kardeş, oğul. Kardeş hacb, oğul tamamını alır."},{id:32,category:"siblings",categoryAr:"أحوال الإخوة",title:"Öz Kız Kardeşin Asabe Maa Gayrihi Olması",titleAr:"الأخت الشقيقة عصبة مع الغير",heirs:"Öz kız kardeş + Kız çocuk",shares:"Öz kız kardeş: Asabe (kalan)",explanation:"Kız çocuk veya oğlun kızı varsa ve erkek kardeş yoksa, öz kız kardeş asabe maa gayrihi olur ve kalanı alır.",dalil:"İbn Mesud'un fetvası ve İcma",example:"Vefat eden: Kız, öz kız kardeş. Kız 1/2, öz kız kardeş kalan 1/2'yi asabe olarak alır."},{id:33,category:"special",categoryAr:"المسائل الخاصة",title:"Ömeriyyeteyn (Garraweyn) - 1. Durum",titleAr:"العمريتان - الأولى",heirs:"Koca + Anne + Baba",shares:"Koca: 1/2, Anne: 1/3 kalanın (1/6), Baba: Kalan",explanation:"Hz. Ömer'in içtihadı: Eş + anne + baba olunca, anne tüm terekenin değil, eşin payından sonra kalanın 1/3'ünü alır. Böylece baba anneden fazla alır.",dalil:"Hz. Ömer, İbn Abbas ve Zeyd b. Sabit'in fetvası",example:"Tereke 6 birim: Koca 3 (1/2), Anne 1 (1/6), Baba 2 (1/3)."},{id:34,category:"special",categoryAr:"المسائل الخاصة",title:"Ömeriyyeteyn (Garraweyn) - 2. Durum",titleAr:"العمريتان - الثانية",heirs:"Karı + Anne + Baba",shares:"Karı: 1/4, Anne: 1/3 kalanın (1/4), Baba: Kalan",explanation:"Karı + anne + baba olunca, anne kalanın 1/3'ünü alır.",dalil:"Hz. Ömer'in içtihadı",example:"Tereke 12 birim: Karı 3 (1/4), Anne 3 (1/4), Baba 6 (1/2)."},{id:35,category:"special",categoryAr:"المسائل الخاصة",title:"Müşerrike (Himariyye)",titleAr:"المشتركة (الحمارية)",heirs:"Koca + Anne + Anne bir kardeşler + Öz kardeşler",shares:"Anne bir ve öz kardeşler 1/3'ü eşit paylaşır",explanation:"Hz. Ömer'in ikinci içtihadı: Anne bir kardeşlerle öz kardeşler aynı anneden olduklarından 1/3'ü eşit paylaşırlar. 'Babamız eşek olsa ne fark eder?' dendiği için 'Himariyye' de denir.",dalil:"Hz. Ömer ve bazı sahabelerin görüşü",example:"Koca 1/2, anne 1/6, anne bir ve öz kardeşler 1/3'ü eşit paylaşır."},{id:36,category:"special",categoryAr:"المسائل الخاصة",title:"Akdariyye",titleAr:"الأكدرية",heirs:"Koca + Anne + Dede + Öz/Baba bir kız kardeş",shares:"Özel hesaplama ile avl ve düzeltme",explanation:"Koca 1/2, anne 1/3, kız kardeş 1/2, dede 1/6 toplamı 1'i aşar. Avl yapılır, sonra kız kardeş ve dede payları birleştirilip 2:1 bölünür.",dalil:"Zeyd b. Sabit'in içtihadı",example:"Çok karmaşık hesaplama gerektirir. Ayrıntılı feraiz kitaplarına bakınız."},{id:37,category:"special",categoryAr:"المسائل الخاصة",title:"Avl (Artırma)",titleAr:"العول",heirs:"Farz payları toplamı > 1",shares:"Orantılı azaltma",explanation:"Farz paylarının toplamı 1'i (terekenin tamamını) aştığında, tüm paylar orantılı olarak azaltılır. Payda artırılarak herkesin payı küçülür.",dalil:"Hz. Ömer zamanında ortaya çıktı, sahabe icması ile kabul edildi",example:"Koca 1/2, 2 kız kardeş 2/3, anne 1/6 = 8/6. Payda 6'dan 8'e çıkar, herkesin payı azalır."},{id:38,category:"special",categoryAr:"المسائل الخاصة",title:"Redd (İade)",titleAr:"الرد",heirs:"Farz payları toplamı < 1 el meseleler",worksTitle:"Klasik başvuru eserleri",methodologyTitle:"Metodoloji notu",methodologyText:"Motor önce net terekeyi esas alır, ardından engelleri ve hacbi kontrol eder; farz sahiplerini yerleştirir, asabeyi işletir, gerekiyorsa avl, redd, zevi’l-erhâm ve beytülmâl mantıklarını seçilen mezhebe göre uygular. İhtilaflı meselelerde ana sonuç seçilen mezhebi esas alır; karşılaştırma bölümü diğer görüşleri yan yana gösterir.",bibliographyTitle:"Öne çıkan kaynaklar",bibliographyText:"Kaynaklar bölümü, hükmün dayandığı başlıkları görünür kılmak için hazırlandı. Resmî veya çekişmeli dosyalarda burada adı geçen temel eserlerin tahkikli baskılarına ve yetkin bir fetva merciine başvurulmalıdır.",readTitle:"Bu sekme nasıl okunmalı?",readText:"Önce ayet ve hadis çerçevesini okuyun. Ardından özel mesele kartlarına geçin. Bir vaka doğrudan mezhepler arasında ayrışıyorsa bunu sonuç ekranındaki karşılaştırma ile birlikte değerlendirin.",proof:"Delil yönü",use:"Nerede kullanılır?",note:"Uygulama notu",faqTitle:"Sık sorulan başlıklar"},en:{badge:"Source guide",title:"Which proofs carry the faraid rulings?",intro:"This tab explains the main textual proofs of inheritance law, the best-known school-specific divergences, and the methodology used by the calculator.",quranTitle:"Primary Qur’anic proofs",hadithTitle:"Primary hadith proofs",issuesTitle:"School-specific special issues",worksTitle:"Classical reference works",methodologyTitle:"Methodology note",methodologyText:"The engine starts from the net estate, checks impediments and exclusion, assigns the fixed shares, activates the residuaries, and then applies awl, radd, Dhawu al-Arham, or Bayt al-mal logic according to the selected madhhab. In disputed issues, the main result follows the chosen school and the comparison section shows the alternatives side by side.",bibliographyTitle:"Highlighted sources",bibliographyText:"This section is designed to show which textual and juristic layers support the result. For official or disputed files, the named works and a qualified authority should still be consulted directly.",readTitle:"How should this section be read?",readText:"Start with the Qur’anic and hadith foundations. Then move to the special-issue cards. If a case genuinely differs between schools, read this tab together with the optional comparison section on the results screen.",proof:"Proof focus",use:"Where it is used",note:"Practical note",faqTitle:"Frequently asked points"},de:{badge:"Quellenübersicht",title:"Welche Belege tragen die Faraid-Regeln?",intro:"Dieser Bereich fasst die wichtigsten Textbelege, die bekannten Schulunterschiede und die vom Rechner verwendete Methodik zusammen.",quranTitle:"Zentrale Qurʾan-Belege",hadithTitle:"Zentrale Hadith-Belege",issuesTitle:"Spezielle schulbezogene Fragen",worksTitle:"Klassische Referenzwerke",methodologyTitle:"Methodikhinweis",methodologyText:"Die Berechnung beginnt mit dem Netto-Nachlass, prüft Hindernisse und Verdrängung, ordnet die festen Anteile zu und behandelt anschließend Asaba, Awl, Radd, Dhawu al-Arham oder Bayt al-mal entsprechend der gewählten Rechtsschule. In Streitfragen folgt das Hauptergebnis der gewählten Schule; der Vergleich zeigt die Alternativen.",bibliographyTitle:"Hervorgehobene Quellen",bibliographyText:"Dieser Abschnitt soll sichtbar machen, auf welche textlichen und juristischen Grundlagen sich das Ergebnis stützt. Bei amtlichen oder strittigen Fällen sollten die genannten Werke und eine qualifizierte Stelle direkt konsultiert werden.",readTitle:"Wie liest man diesen Bereich?",readText:"Beginnen Sie mit Qurʾan und Hadith, wechseln Sie dann zu den Sonderfällen. Wenn sich eine Frage wirklich zwischen den Schulen unterscheidet, lesen Sie diesen Bereich zusammen mit dem Vergleich im Ergebnisbildschirm.",proof:"Belegfokus",use:"Wo wird es genutzt?",note:"Praxisnotiz",faqTitle:"Häufige Fragen"},es:{badge:"Guía de fuentes",title:"¿Qué pruebas sostienen las reglas de farāʾiḍ?",intro:"Esta sección resume las pruebas textuales principales, las diferencias más conocidas entre escuelas y la metodología utilizada por la calculadora.",quranTitle:"Pruebas coránicas principales",hadithTitle:"Pruebas principales de hadiz",issuesTitle:"Cuestiones especiales según la escuela",worksTitle:"Obras clásicas de referencia",methodologyTitle:"Nota metodológica",methodologyText:"El motor parte de la herencia neta, revisa impedimentos y exclusiones, asigna las cuotas fijas y después aplica la lógica de los agnados, ʿawl, radd, dhawū al-arḥām o bayt al-māl según el madhhab seleccionado. En cuestiones discutidas, el resultado principal sigue la escuela elegida y la comparación muestra las alternativas.",bibliographyTitle:"Fuentes destacadas",bibliographyText:"Esta sección busca mostrar las capas textuales y jurídicas que sostienen el resultado. En expedientes oficiales o controvertidos deben consultarse directamente las obras citadas y una autoridad cualificada.",readTitle:"¿Cómo leer esta sección?",readText:"Empiece por el marco coránico y los hadices. Después pase a las tarjetas de cuestiones especiales. Si un caso difiere realmente entre escuelas, lea esta sección junto con la comparación opcional del resultado.",proof:"Enfoque de la prueba",use:"Dónde se usa",note:"Nota práctica",faqTitle:"Preguntas frecuentes"},ar:{badge:"دليل المصادر",title:"ما الأدلة التي تقوم عليها أحكام الفرائض؟",intro:"يعرض هذا القسم أهم الأدلة النصية، وأشهر مواضع اختلاف المذاهب، والمنهج الذي تسير عليه الآلة في بناء النتيجة.",quranTitle:"الأدلة القرآنية الأساسية",hadithTitle:"الأدلة الحديثية الأساسية",issuesTitle:"المسائل الخاصة بحسب المذهب",worksTitle:"المراجع الكلاسيكية",methodologyTitle:"ملاحظة منهجية",methodologyText:"يبدأ المحرك بصافي التركة، ثم يفحص الموانع والحجب، ويعطي أصحاب الفروض فروضهم، ثم يعالج العصبة، ويطبق العول أو الرد أو ذوي الأرحام أو بيت المال بحسب المذهب المختار. وفي المسائل المختلف فيها تتبع النتيجة الأساسية المذهب المختار بينما يعرض قسم المقارنة البدائل جنباً إلى جنب.",bibliographyTitle:"المصادر البارزة",bibliographyText:"أُعد هذا القسم لإظهار الطبقات النصية والفقهية التي يستند إليها الناتج. وفي الملفات الرسمية أو المختلف فيها ينبغي الرجوع مباشرة إلى الكتب المذكورة وإلى جهة علمية مؤهلة.",readTitle:"كيف يُقرأ هذا القسم؟",readText:"ابدأ بآيات الميراث والأحاديث، ثم انتقل إلى بطاقات المسائل الخاصة. وإذا كانت المسألة تختلف فعلاً بين المذاهب فاقرأ هذا القسم مع المقارنة الظاهرة في شاشة النتيجة.",proof:"وجه الدليل",use:"موضع الاستعمال",note:"ملاحظة عملية",faqTitle:"أسئلة متكررة"}},_0={tr:[["Nisâ 11","Çocuklar, anne-baba ve temel farz paylar","Tek kız için 1/2, iki veya daha çok kız için 2/3; çocuk bulunduğunda anne ve baba için 1/6 gibi temel paylar burada belirlenir.","Kızlar, ebeveynler ve çocuklu vakalar."],["Nisâ 12","Eşlerin payı ve anne bir kardeşler","Koca ve eşin payı ile anne bir kardeşlerin 1/6 veya ortak 1/3 payı bu ayette yer alır.","Eşler ve anne bir kardeşler."],["Nisâ 176","Kelâle ve kardeşler","Öz ve baba bir kardeşlerin tek, çift veya karışık halde nasıl pay alacağı bu ayette temellenir.","Kardeşler ve kelâle vakaları."],["Enfâl 75","Yakın akrabalığın önceliği","Yakın akrabalık bağının önceliği vurgulanır; zevi’l-erhâm tartışmalarında önemli dayanaklardan biridir.","Zevi’l-erhâm ve beytülmâl tartışmaları."]],en:[["Qur’an 4:11","Children, parents, and the core fixed shares","This verse establishes the foundational shares of daughters, parents, and direct descendants, including one half for a single daughter and two thirds for multiple daughters without a son.","Cases involving daughters, parents, and descendants."],["Qur’an 4:12","Spouses and maternal siblings","This verse defines the shares of the husband and wives, and the one-sixth or collective one-third of the maternal siblings.","Cases involving spouses and maternal siblings."],["Qur’an 4:176","Kalalah and siblings","This verse grounds the inheritance of full and paternal siblings in kalalah cases and supports the 2:1 rule when male and female siblings inherit together.","Sibling cases, kalalah, and several special issues."],["Qur’an 8:75","Priority of close kinship","This verse supports the priority of close blood relations and is central to discussions of Dhawu al-Arham and Bayt al-mal.","Remote relatives and Bayt al-mal issues."]]},z0={tr:[["Buhârî, Müslim","Farz payları verin, kalan asabeye gider","Önce farz sahiplerinin payı verilir; kalan en yakın erkek asabeye aittir.","Farz + asabe sırasının kurulması."],["İbn Mâce, Tirmizî","Mirasçıya vasiyet yoktur","Geçerli vasiyet, normal şartta mirasçı olmayan lehinedir ve meşru sınır içinde kalmalıdır.","Vasiyetin sınırı ve mirasla ilişkisi."],["Buhârî, Müslim","Üçte bir, üçte bir bile çoktur","Vasiyet üst sınırının 1/3 olduğunu gösteren meşhur delildir.","Net terekenin belirlenmesi."],["Buhârî, Müslim","Din farkı ve katl engelleri","Din farkı ve haksız öldürme, klasik engeller arasında yer alır.","Miras engellerinin uygulanması."]],en:[["Bukhari, Muslim","Give the fixed shares first, then the residue","The fixed shares are assigned first, and whatever remains goes to the nearest qualifying residuary heir.","Establishing the sequence of fixed shares and residuaries."],["Ibn Majah, Tirmidhi","There is no bequest for an heir","A valid will normally benefits a non-heir and stays within its lawful limits.","The relationship between wills and inheritance shares."],["Bukhari, Muslim","One third, and even one third is much","This narration is the well-known proof for limiting a will to one third of the estate.","Defining the net estate before distribution."],["Bukhari, Muslim","Difference of religion and unlawful killing","Difference of religion and unlawful killing are among the classic impediments to inheritance.","Applying legal impediments."]]},S0={tr:[["Dede ile kardeşler",["Hanefî: Dede, kardeşleri düşürür.","Cumhur: Dede, bazı durumlarda kardeşlerle birlikte değerlendirilir."],"Kelâle ayetlerinin uygulanışı ve sahabe içtihadı.","Bu başlık ana sonucu en çok değiştiren ihtilaflardan biridir."],["Müşerrike / Himariyye",["Hanefî: Öz kardeş, anne bir kardeşlerle ortak edilmez.","Cumhur: Öz kardeşler, anne bir kardeşlerle aynı üçte bire katılabilir."],"Nisâ 12 ve 176’nın birlikte uygulanışı ile sahabe uygulamaları.","Karşılaştırma ekranında en belirgin farklardan biridir."],["Akdariyye",["Hanefî: Dede kardeşi düşürdüğü için cumhurdaki özel çözüm aynı biçimde kurulmaz.","Cumhur: 27’lik meşhur çözüm uygulanır."],"Dede-kardeşler usulü ve cumhur kaynaklarındaki özel çözüm.","Özel meselelerin neden mezhep seçimi istediğini açıkça gösterir."],["Zevi’l-erhâm ve beytülmâl",["Hanefî / Hanbelî: Uygun durumda zevi’l-erhâm devreye girer.","Şâfiî / Mâlikî: Beytülmâlin işleyişi ve tercih edilen alt görüş önemlidir."],"Enfâl 75 ve zevi’l-erhâmı düzenleyen fıkhî usuller.","Uzak akraba vakalarında motorun mezhep duyarlı çalışması gerekir."]],en:[["Grandfather with siblings",["Hanafi: The true grandfather excludes the siblings.","Jumhur: The grandfather may be assessed together with the siblings in certain forms."],"The application of the kalalah verses and the juristic reading of companion practice.","This is one of the biggest areas where the selected school changes the final table."],["Mushtaraka / Himariyya",["Hanafi: Full siblings are not added to the maternal siblings’ one-third.","Jumhur: Full siblings may join the maternal siblings in the shared one-third."],"The relationship between Qur’an 4:12 and 4:176, together with companion practice.","It often produces the clearest difference on the comparison screen."],["Akdariyya",["Hanafi: Because the grandfather excludes the sister, the famous Jumhur solution does not arise in the same way.","Jumhur: The well-known 27-based solution is applied."],"The grandfather-siblings doctrine and the classical Jumhur treatment of the special case.","This issue clearly shows why the calculator needs a real school-sensitive engine."],["Dhawu al-Arham and Bayt al-mal",["Hanafi / Hanbali: Dhawu al-Arham may enter once fixed-share heirs and residuaries are exhausted.","Shafiʿi / Maliki: The role of Bayt al-mal and the adopted operative view becomes decisive."],"Qur’an 8:75 and the juristic methods governing remote uterine relatives.","This matters most in cases with remote relatives or when a spouse remains without a residuary heir."]]},j0={tr:[["Koca tek başına kaldığında bakiye ne olur?","Hanefî çizgide koca, çocuk veya torun yoksa 1/2 alır. Kalan pay eşe redd edilmez. Vakanın yapısına göre bakiye zevi’l-erhâm, beytülmâl veya ayrıca incelenecek kamu hakkı alanına kalabilir."],["Üvey çocuklar neden listede mirasçı değildir?","Üvey çocuk ile müteveffa arasında otomatik miras doğuran nesep bağı bulunmaz. Bu sebeple feraiz hesabında pay sahibi sayılmaz; ancak sağlığında hibe veya geçerli vasiyet ile mal bırakılması mümkündür."],["Mehir miras hesabına nasıl girer?","Ödenmemiş mehir bir borçtur. Koca öldüğünde tereke paylaşımından önce düşülür. Kadın öldüğünde henüz tahsil edilmemiş mehir alacağı, onun terekesine dahil edilir."]],en:[["What happens to the residue if the husband is the only heir?","In the Hanafi line, the husband receives one half when there is no child or grandchild. The remaining half is not returned to the spouse by radd. Depending on the case, it may move to Dhawu al-Arham, Bayt al-mal, or a further legal review."],["Why are stepchildren not listed as heirs?","A stepchild does not inherit automatically because there is no blood relationship or inheriting lineage. A gift during life or a valid bequest may still benefit the stepchild."],["How does mahr affect the inheritance calculation?","An unpaid mahr is a debt. If the husband dies, it is deducted from his estate before distribution. If the wife dies while it is still unpaid, her claim to that mahr is treated as part of her estate."]]},T0={tr:["Kur’an-ı Kerîm: Nisâ 11, 12, 176; Enfâl 75","Buhârî ve Müslim’in ferâiz bölümleri","el-Mebsût (Serahsî)","Bedâʾiʿu’s-Sanâʾiʿ (Kâsânî)","el-Hidâye (Mergînânî)","el-Mecmûʿ (Nevevî)","el-Hâvî (Mâverdî)","el-Muğnî (İbn Kudâme)","Sirâciyye ve güvenilir mezhep içi fetva mecmuaları"],en:["The Qur’an: 4:11, 4:12, 4:176, and 8:75","The inheritance chapters of Bukhari and Muslim","al-Mabsut (Sarakhsi)","Bada’iʿ al-Sana’iʿ (Kasani)","al-Hidaya (Marghinani)","al-Majmuʿ (Nawawi)","al-Hawi (Mawardi)","al-Mughni (Ibn Qudama)","Sirajiyya and reliable intra-school fatwa collections"]},hf=({language:s="tr"})=>{const u=s==="tr"?"tr":"en",o=cf[s]??cf[u],c=_0[u],f=z0[u],b=S0[u],m=T0[u],_=j0[u];return r.jsxs("div",{className:"space-y-8",children:[r.jsx("section",{className:"rounded-[24px] border border-stone-200 bg-white/90 p-6 md:p-8 shadow-[0_14px_40px_rgba(28,25,23,0.05)]",children:r.jsxs("div",{className:"max-w-4xl space-y-4",children:[r.jsx("div",{className:"inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-semibold tracking-wide text-emerald-800",children:o.badge}),r.jsxs("div",{children:[r.jsx("h3",{className:"text-xl font-semibold text-stone-950",children:o.title}),r.jsx("p",{className:"mt-3 text-sm leading-7 text-stone-600",children:o.intro})]})]})}),r.jsxs("section",{className:"grid gap-8 xl:grid-cols-2",children:[r.jsxs("div",{className:"rounded-[24px] border border-stone-200 bg-white/90 p-6 shadow-[0_14px_40px_rgba(28,25,23,0.05)]",children:[r.jsx("h3",{className:"text-lg font-semibold text-stone-950",children:o.quranTitle}),r.jsx("div",{className:"mt-5 space-y-4",children:c.map(([v,S,y,p])=>r.jsxs("article",{className:"rounded-2xl border border-emerald-200 bg-emerald-50/70 p-4",children:[r.jsxs("div",{className:"flex items-center justify-between gap-3",children:[r.jsx("h4",{className:"font-medium text-stone-900",children:S}),r.jsx("span",{className:"rounded-full border border-emerald-200 bg-white px-2.5 py-1 text-xs font-medium text-emerald-800",children:v})]}),r.jsx("p",{className:"mt-2 text-sm leading-6 text-stone-700",children:y}),r.jsx("p",{className:"mt-3 text-xs uppercase tracking-[0.14em] text-emerald-800",children:o.use}),r.jsx("p )]",children:[r.jsx("h3",{className:"text-lg font-semibold text-emerald-900",children:o.readTitle}),r.jsx("p",{className:"mt-3 text-sm leading-7 text-stone-700",children:o.readText})]})]})]})},N0=Object.freeze(Object.defineProperty({__proto__:null,SourcesPanel:hf,default:hf},Symbol.toStringTag,{value:"Module"})),A0=["faraid","ashabulFuruz","asaba","zawilArham","hajb","awl","radd","netEstate","haml","khunsa","mafqud","munasakhat"],E0={tr:{badge:"Faraid rehberi",title:"Feraiz ilmini adım adım anlamak için kısa bir rehber",intro:"Bu sekme, hesaplama ekranında gördüğünüz sonuçların arka planını öğretmek için hazırlandı. Amaç sadece payı göstermek değil; o payın neden ortaya çıktığını açık ve sistemli şekilde anlatmaktır.",verseNote:"Nisâ sûresindeki miras ayetleri faraid ilminin temelini oluşturur. Bu nedenle hükümler tahmine göre değil, nasla sabit paylar ve yerleşik fıkhî kurallar üzerinden kurulur.",orderTitle:"Faraid hesabı hangi sırayla yapılır?",orderIntro:"Bir miras hesabını doğru kurmanın en sağlam yolu, her vakada aynı sıralamayı takip etmektir.",order:[["1. Net tereke belirlenir","Önce cenaze giderleri, borçlar ve geçerli vasiyet ayrılır. Paylaşım kalan net tereke üzerinden yapılır."],["2. Miras engelleri kontrol edilir","Katl, din farkı ve benzeri engeller varsa ilgili kişi görünse bile pay alamaz."],["3. Hacb uygulanır","Daha yakın veya daha güçlü mirasçılar bazı kimseleri tamamen düşürür veya payını azaltır."],["4. Farz paylar verilir","Önce payı nasla belirlenmiş mirasçılar payını alır."],["5. Asabe değerlendirilir","Farz paylardan sonra bakiye kalırsa asabe devreye girer."],["6. Gerekirse avl, redd veya zevi’l-erhâm aşaması gelir","Toplam pay terekeyi aşarsa avl, bakiye kalıp asabe bulunmazsa redd; her ikisi de yoksa bazı mezheplerde zevi’l-erhâm veya beytülmâl gündeme gelir."]],termsTitle:"Sık kullanılan temel kavramlar",familyTitle:"Üvey çocuklar ve mehir hakkında kısa notlar",familyCards:[["Üvey çocuklar","Üvey çocuk, yani arada kan bağı veya sahih nesep bağı bulunmayan çocuk, feraiz hesabında kendiliğinden mirasçı olmaz. Ancak kişi sağlığında hibe yapabilir veya vefatından sonra geçerli vasiyet sınırları içinde ona mal bırakabilir."],["Mehir","Ödenmemiş mehir, kocanın zimmetinde bir borçtur. Kadın vefat ettiğinde henüz tahsil edilmemiş mehir alacağı terekeye dahil edilir; koca vefat ettiğinde ise ödenmemiş mehir, miras paylaşımından önce borç olarak terikeden düşülür."]],schoolTitle:"Neden mezhep seçimi bulunuyor?",schoolText:"Her mesele bütün mezheplerde aynı sonuca ulaşmaz. Özellikle dede ile kardeşler, Müşerrike, Akdariyye ve zevi’l-erhâm gibi alanlarda farklı sonuçlar çıkabilir. Bu yüzden ana sonuç seçtiğiniz mezhebe göre hesaplanır; isterseniz sonuç ekranında diğer mezhepleri ayrıca karşılaştırabilirsiniz."},en:{badge:"Faraid guide",title:"A clear guide to understanding faraid step by step",intro:"This tab explains the logic behind the figures shown by the calculator. The goal is not only to show a share, but also to explain why that share appears in a structured and understandable way.",verseNote:"The inheritance verses in Surat al-Nisa form the foundation of faraid. For that reason the rules are not based on guesswork, but on revealed shares and established juristic principles.",orderTitle:"In which order should a faraid calculation be done?",orderIntro:"The safest way to build an inheritance case correctly is to follow the same sequence every time.",order:[["1. Define the net estate","First deduct funeral expenses, debts, and any valid will. Distribution is based on what remains."],["2. Check legal impediments","If unlawful killing, difference of religion, or another valid impediment exists, that person cannot inherit even if listed."],["3. Apply exclusion and reduction","A closer or stronger heir may block another heir entirely or reduce the share they would otherwise receive."],["4. Assign the fixed shares","Heirs whose portions are fixed by revelation receive their shares first."],["5. Evaluate the residuaries","If any residue remains after the fixed shares, it passes to the residuary heirs."],["6. Apply awl, radd, or Dhawu al-Arham if needed","If the fixed shares exceed the estate, awl applies. If residue remains and no residuary heir exists, radd may apply. If both routes are exhausted, some schools then move to Dhawu al-Arham or Bayt al-mal."]],termsTitle:"Core terms you will see often",familyTitle:"Short notes on stepchildren and mahr",familyCards:[["Stepchildren","A stepchild, meaning a child with no blood relationship or legally inheriting lineage, does not inherit automatically in faraid. A person may still gift property during life or leave a valid bequest within its lawful limits."],["Mahr","An unpaid mahr remains a debt. If the wife dies before receiving it, the unpaid mahr is treated as part of her estate. If the husband dies while it is still unpaid, it is deducted from his estate as a debt before the inheritance is distributed."]],schoolTitle:"Why is there a madhhab selection?",schoolText:"Not every inheritance problem ends the same way in every Sunni school. Grandfather with siblings, Mushtaraka, Akdariyya, and Dhawu al-Arham are the clearest examples. The main result therefore follows the school you choose, while comparison with the other schools remains optional on the results screen."},de:{badge:"Faraid-Leitfaden",title:"Eine kurze Einführung, um Faraid Schritt für Schritt zu verstehen",intro:"Dieser Bereich erklärt die Logik hinter den Ergebnissen des Rechners. Ziel ist nicht nur die Zahl zu zeigen, sondern den Aufbau des Urteils nachvollziehbar zu machen.",verseNote:"Die Erbverse der Sure an-Nisa bilden das Fundament des Faraid-Rechts. Deshalb beruhen die Regeln auf festgelegten Texten und anerkannten juristischen Prinzipien.",orderTitle:"In welcher Reihenfolge wird gerechnet?",orderIntro:"Am sichersten ist es, jeden Fall in derselben klaren Reihenfolge aufzubauen.",order:[["1. Netto-Nachlass bestimmen","Zuerst werden Bestattungskosten, Schulden und ein gültiges Testament abgezogen. Verteilung erfolgt nur auf den Rest."],["2. Erbhindernisse prüfen","Bei Tötung, Religionsverschiedenheit oder einem anderen anerkannten Hindernis entfällt das Erbrecht."],["3. Hacb anwenden","Nähere oder stärkere Erben können andere Erben ganz ausschließen oder ihren Anteil mindern."],["4. Feste Anteile geben","Zuerst erhalten die Erben mit festem Anteil ihren Anteil."],["5. Asaba behandeln","Bleibt nach den festen Anteilen ein Rest, geht er an die residuarischen Erben."],["6. Awl, Radd oder Dhawu al-Arham","Übersteigen die Anteile den Nachlass, gilt Awl. Bleibt Rest ohne Asaba, kommt Radd in Betracht. Danach folgen je nach Schule entferntere Verwandte oder Bayt al-mal."]],termsTitle:"Wichtige Grundbegriffe",familyTitle:"Kurze Hinweise zu Stiefkindern und Mahr",familyCards:[["Stiefkinder","Stiefkinder erben im klassischen Faraid nicht automatisch, da keine blutsmäßige oder vererbende Abstammung vorliegt. Zuwendungen zu Lebzeiten oder ein gültiges Testament bleiben möglich."],["Mahr","Nicht gezahlter Mahr ist eine Schuld. Stirbt der Ehemann, wird sie vor der Verteilung vom Nachlass abgezogen. Stirbt die Ehefrau, zählt ihr offener Anspruch zu ihrem Nachlass."]],schoolTitle:"Warum gibt es eine Madhhab-Auswahl?",schoolText:"Nicht jede Erbfrage endet in allen sunnitischen Schulen gleich. Vor allem Großvater-mit-Geschwistern, Mushtaraka, Akdariyya und Dhawu al-Arham unterscheiden sich. Deshalb folgt das Hauptergebnis der gewählten Schule."},es:{badge:"Guía de farāʾiḍ",title:"Una guía breve para entender farāʾiḍ paso a paso",intro:"Esta sección explica la lógica detrás de los resultados de la calculadora. El objetivo no es solo mostrar una cuota, sino explicar por qué aparece.",verseNote:"Las aleyas de la herencia de la sura al-Nisāʾ forman la base de la ciencia de las herencias. Por ello, las reglas se apoyan en textos revelados y principios jurídicos consolidados.",orderTitle:"¿En qué orden se hace el cálculo?",orderIntro:"La forma más segura de construir un caso es seguir siempre la misma secuencia.",order:[["1. Determinar la herencia neta","Primero se descuentan gastos funerarios, deudas y testamento válido. La distribución se hace sobre el resto."],["2. Revisar impedimentos","Si existe homicidio injusto, diferencia de religión u otro impedimento reconocido, esa persona no hereda."],["3. Aplicar exclusión","Un heredero más cercano o más fuerte puede excluir a otro o reducir su cuota."],["4. Asignar las cuotas fijas","Los herederos con cuota fijada por la revelación la reciben primero."],["5. Evaluar a los agnados","Si queda remanente tras las cuotas fijas, pasa a los herederos agnáticos."],["6. Aplicar ʿawl, radd o dhawū al-arḥām","Si las cuotas superan la herencia, se aplica ʿawl. Si sobra remanente sin agnado, puede aplicarse radd. Después, según el madhhab, pueden entrar los parientes uterinos o bayt al-māl."]],termsTitle:"Términos básicos frecuentes",familyTitle:"Notas breves sobre hijastros y mahr",familyCards:[["Hijastros","El hijastro no hereda automáticamente en el sistema clásico de farāʾiḍ porque no existe vínculo sanguíneo o línea hereditaria directa. Siguen siendo posibles la donación y el legado válido."],["Mahr","El mahr no pagado es una deuda. Si muere el esposo, se descuenta antes de repartir la herencia. Si muere la esposa, su crédito pendiente entra en su patrimonio."]],schoolTitle:"¿Por qué existe una selección de madhhab?",schoolText:"No todos los casos de herencia terminan igual en todas las escuelas sunníes. Abuelo con hermanos, Mushtaraka, Akdariyya y dhawū al-arḥām son ejemplos claros. Por eso el resultado principal sigue la escuela elegida."},ar:{badge:"دليل الفرائض",title:"دليل مختصر لفهم علم الفرائض خطوة خطوة",intro:"يشرح هذا القسم المنطق الكامن وراء النتائج التي يعرضها الحاسب. فالغاية ليست إظهار الرقم فقط، بل بيان سبب ظهوره بصورة واضحة ومنظمة.",verseNote:"آيات المواريث في سورة النساء هي الأساس الذي يقوم عليه علم الفرائض، ولهذا تبنى الأحكام على النصوص المقررة والقواعد الفقهية المستقرة.",orderTitle:"بأي ترتيب يجرى حساب الفرائض؟",orderIntro:"أوثق طريقة لبناء المسألة هي الالتزام بالترتيب نفسه في كل حالة.",order:[["1. تحديد صافي التركة","تخصم أولاً مؤنة التجهيز والديون والوصية الصحيحة، ثم يقع التقسيم على الباقي."],["2. فحص موانع الإرث","إذا وجد قتل أو اختلاف دين أو مانع معتبر آخر فلا يرث الشخص ولو كان مذكوراً في القائمة."],["3. تطبيق الحجب","قد يحجب الوارث الأقرب أو الأقوى غيره حجب حرمان أو حجب نقصان."],["4. إعطاء أصحاب الفروض فروضهم","يبدأ بأصحاب الأنصبة المقدرة شرعاً."],["5. النظر في العصبة","إذا بقي شيء بعد الفروض انتقل إلى العصبة."],["6. العول أو الرد أو ذوو الأرحام","إذا زادت الفروض على التركة وقع العول، وإذا بقي فضل بلا عصبة جاء الرد، ثم تنظر بعض المذاهب بعد ذلك في ذوي الأرحام أو بيت المال."]],termsTitle:"مصطلحات أساسية متكررة",familyTitle:"ملاحظات مختصرة حول أبناء الزوجة والمهر",familyCards:[["أولاد الزوج أو الزوجة","الولد الذي لا تربطه بالميت قرابة نسب أو جهة إرث معتبرة لا يرث تلقائياً في الفرائض، لكن تبقى الهبة في الحياة والوصية الصحيحة ممكنتين."],["المهر","المهر غير المقبوض دين في الذمة. فإذا مات الزوج خُصم من تركته قبل القسمة، وإذا ماتت الزوجة عُد حقها غير المقبوض جزءاً من تركتها."]],schoolTitle:"لماذا يوجد اختيار للمذهب؟",schoolText:"ليست كل مسائل الإرث متفقة في جميع المذاهب السنية. ومن أوضح أمثلة ذلك الجد مع الإخوة والمشتركة والأكدرية وذوو الأرحام، ولذلك تتبع النتيجة الأساسية المذهب المختار."}},mf=({language:s="tr"})=>{const u=E0[s];return r.jsxs("div",{className:"space-y-8",children:[r.jsx("section",{className:"rounded-[24px] border border-stone-200 bg-white/90 p-6 md:p-8 shadow-[0_14px_40px_rgba(28,25,23,0.05)]",children:r.jsxs("div",{className:"max-w-4xl space-y-4",children:[r.jsx("div",{className:"inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-semibold tracking-wide text-emerald-800",children:u.badge}),r.jsxs("div",{children:[r.jsx("h3",{className:"text-xl font-semibold text-stone-950",children:u.title}),r.jsx("p",{className:"mt-3 text-sm leading-7 text-ston
